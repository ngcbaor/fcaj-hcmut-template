name: Deploy Hugo site and Build PDF Reports

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.134.3"
          extended: true

      - name: Build website
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

  build-pdf:
    runs-on: ubuntu-latest
    # needs: build-deploy
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install TeX Live and pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-other \
            latexmk \
            pandoc

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Convert Hugo content to LaTeX
        run: python3 scripts/convert_hugo_to_latex.py en

      - name: Compile English PDF
        working-directory: report
        run: |
          latexmk -pdf -interaction=nonstopmode -file-line-error main_en.tex || (grep -A 8 -B 2 "^!" main_en.log | head -n 50; exit 1)
          cp main_en.pdf ../report_en.pdf
      
      - name: Package LaTeX source
        run: |
          zip -r latex_source.zip report scripts content config.toml \
            -x "report/*.aux" \
            -x "report/*.log" \
            -x "report/*.out" \
            -x "report/*.toc" \
            -x "report/*.fls" \
            -x "report/*.fdb_latexmk" \
            -x "report/*.pdf"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest Internship Report (English)"
          body: |
            ## Internship Report PDF

            Automated English PDF report generated from Hugo content on push to `main`.

            - **English Report**: `report_en.pdf`
            - **LaTeX source**: `latex_source.zip`
          artifacts: "report_en.pdf,latex_source.zip"
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload LaTeX Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-build-logs
          path: |
            report/*.log
            report/generated/
